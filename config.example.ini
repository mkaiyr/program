[supabase]
# Скопируйте этот файл в config.ini и подставьте свои значения.
# Project URL из Project Settings -> Data API
url = https://xxxx.supabase.co
# Только публичный ключ (sb_publishable_... или anon). Ключи secret/service_role сюда НЕ вставлять.
key = sb_publishable_...

# ---- Печать чеков (необязательно). Без этого раздела предпросмотр чека работает, а печать сообщает «принтер не настроен». ----
# Принтер 80 мм печатает чек как картинку (растр): так казахские буквы қ ұ ү ғ ң і ә ө печатаются на любом ESC/POS-принтере.
# [printer]
# mode = network        ; network — сетевой принтер по адресу, system — принтер, установленный в системе, file — запись в файл (проверка без принтера)
# host = 192.168.1.50   ; для network: адрес принтера
# port = 9100           ; для network: порт RAW (обычно 9100)
# name = POS-80         ; для system: имя принтера в системе
# path = receipt.bin    ; для file: куда записать команды принтера
# width_dots = 576      ; ширина печати: 80 мм обычно 576 точек (у части моделей 512); кратно 8
# timeout = 5           ; секунд ожидания ответа принтера
# cut = yes             ; обрезать чек после печати
# log = print_log.jsonl ; журнал печати (по умолчанию — в домашней папке пользователя, .bistro_cashier)
#
# [receipt]
# cafe_name = Кафе Бистро   ; название в шапке чека
